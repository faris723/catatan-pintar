<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catatan Pintar — Offline</title>
  <meta name="theme-color" content="#47593f">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon-192.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'IBM Plex Sans', sans-serif; background: #e9e3d5; color: #2b2a24; }
    .mono { font-family: 'IBM Plex Mono', monospace; }
  </style>
</head>
<body class="p-4 max-w-2xl mx-auto">
  <header class="flex justify-between items-center border-b-2 border-stone-800 pb-3 mb-4">
    <h1 class="text-2xl font-bold mono">Catatan Pintar</h1>
    <div class="flex gap-2">
      <button id="addBtn" class="bg-emerald-700 text-white px-4 py-2 rounded text-sm font-semibold mono">＋ Catatan Baru</button>
    </div>
  </header>

  <div class="mb-4">
    <input type="text" id="searchInput" placeholder="Cari catatan..." class="w-full p-2 border border-stone-300 rounded bg-white text-sm mono">
  </div>

  <div id="notesContainer" class="flex flex-col gap-3"></div>

  <!-- Form Editor Sederhana -->
  <div id="editorModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4">
    <div class="bg-stone-50 w-full max-w-lg p-6 rounded shadow-lg flex flex-col gap-3">
      <h2 id="modalTitle" class="text-lg font-bold mono">Tulis Catatan</h2>
      <input type="hidden" id="noteId">
      <input type="text" id="noteTitleInput" placeholder="Judul..." class="p-2 border border-stone-300 rounded bg-white mono text-sm">
      <textarea id="noteContentInput" rows="5" placeholder="Tulis catatan di sini..." class="p-2 border border-stone-300 rounded bg-white mono text-sm"></textarea>
      <div class="flex justify-end gap-2 mt-2">
        <button id="cancelBtn" class="px-4 py-2 border border-stone-300 rounded text-sm mono">Batal</button>
        <button id="saveBtn" class="px-4 py-2 bg-emerald-700 text-white rounded text-sm mono font-semibold">Simpan</button>
      </div>
    </div>
  </div>

  <!-- Pustaka Pendukung & Logika Utama -->
  <script src="cordova.js"></script>
  <script type="module">
    import { StorageManager } from './storage.js';

    document.addEventListener('DOMContentLoaded', async () => {
      await StorageManager.initDB();
      loadNotes();

      const container = document.getElementById('notesContainer');
      const modal = document.getElementById('editorModal');
      
      document.getElementById('addBtn').onclick = () => {
        document.getElementById('noteId').value = '';
        document.getElementById('noteTitleInput').value = '';
        document.getElementById('noteContentInput').value = '';
        document.getElementById('modalTitle').innerText = 'Tulis Catatan Baru';
        modal.classList.remove('hidden');
        modal.classList.add('flex');
      };

      document.getElementById('cancelBtn').onclick = () => {
        modal.classList.remove('flex');
        modal.classList.add('hidden');
      };

      document.getElementById('saveBtn').onclick = async () => {
        const id = document.getElementById('noteId').value || Date.now().toString();
        const title = document.getElementById('noteTitleInput').value;
        const content = document.getElementById('noteContentInput').value;
        const timestamp = Date.now();

        if (!title && !content) return alert('Judul atau isi tidak boleh kosong!');

        await StorageManager.saveNote({ id, title, content, timestamp });
        modal.classList.remove('flex');
        modal.classList.add('hidden');
        loadNotes();
      };

      async function loadNotes() {
        const notes = await StorageManager.getAllNotes();
        container.innerHTML = '';
        if (notes.length === 0) {
          container.innerHTML = '<p class="text-stone-500 text-center py-8 mono text-sm">Belum ada catatan.</p>';
          return;
        }
        notes.forEach(note => {
          const card = document.createElement('div');
          card.className = 'bg-white p-4 border border-stone-300 rounded shadow-sm relative';
          card.innerHTML = `
            <h3 class="font-bold text-base mb-1 mono">${escapeHtml(note.title || 'Tanpa Judul')}</h3>
            <p class="text-stone-600 text-sm whitespace-pre-wrap mono">${escapeHtml(note.content)}</p>
            <button class="absolute top-3 right-3 text-red-500 text-xs mono hover:underline" data-id="${note.id}">Hapus</button>
          `;
          card.querySelector('button').onclick = async (e) => {
            if (confirm('Hapus catatan ini?')) {
              await StorageManager.deleteNote(e.target.dataset.id);
              loadNotes();
            }
          };
          container.appendChild(card);
        });
      }

      function escapeHtml(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }
    });
  </script>
  <script src="./pwa-updates.js"></script>
</body>
</html>
